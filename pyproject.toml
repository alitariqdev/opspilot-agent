[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "1.0.0"
description = "Evidence-Grounded AI Agent for Software Incident Diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ali Tariq"}
]
keywords = ["incident-diagnosis", "sre", "devops", "ai-agent", "evidence-grounded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "streamlit==1.64.0",
    "langgraph==1.2.11",
    "openai==3.16.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "rank-bm25==0.2.2",
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/your-username/opspilot-agent"
Repository = "https://github.com/your-username/opspilot-agent"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opspilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
